<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-light: #f8fafc;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #f59e0b;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --success-bg: #dcfce7;
            --success-text: #166534;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            color: var(--text-main);
            line-height: 1.6;
            background-color: var(--bg-light);
        }

        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
            padding: 1.2rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--accent);
        }

        .navbar-links {
            display: flex;
            list-style: none;
        }

        .navbar-links li {
            margin: 0 1.5rem;
        }

        .navbar-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1rem;
            transition: color 0.2s ease;
        }

        .navbar-links a:hover {
            color: var(--accent);
        }

        .hero {
            background-color: var(--bg-dark);
            min-height: 45vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 3rem 1.5rem;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 1.25rem;
            color: #94a3b8;
            max-width: 650px;
        }

        .container {
            max-width: 800px;
            /* Narrowed down layout for perfect form alignment */
            margin: 4rem auto;
            padding: 0 1.5rem;
        }

        /* 🔔 Success Alert Message Box */
        .alert-success {
            background-color: var(--success-bg);
            color: var(--success-text);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 2rem;
            text-align: center;
            font-weight: 600;
            border: 1px solid #bbf7d0;
        }

        /* 📝 Form Layout Styling */
        .form-section {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .form-section h2 {
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            padding: 0.85rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .footer {
            background-color: var(--bg-dark);
            color: #ffffff;
            text-align: center;
            padding: 2.5rem 2rem;
            margin-top: 5rem;
            border-top: 1px solid #1e293b;
        }

        .footer p {
            font-size: 0.95rem;
            color: #94a3b8;
        }

        @media (max-width: 600px) {
            .navbar-links li {
                margin: 0 0.75rem;
            }

            .navbar-links a {
                font-size: 0.95rem;
            }

            .hero h1 {
                font-size: 2.2rem;
            }

            .form-section {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <ul class="navbar-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Explore</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <header class="hero">

        <h1>Thank You for Visiting, {{ name }}!</h1>
    </header>

    <main class="container">

   
        <!-- 📝 Interactive Form Area -->
        <section class="form-section">
            <h2>Feedback Form</h2>
            <form action="/submit" method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter Your Name" required>
                </div>
                <div class="form-group">
                    <label for="email">Contact Number</label>
                    <input type="number"  id="number" name="pnumber" placeholder="Enter Your Contect number" required>
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Type your text message here..."
                        required></textarea>
                </div>
                <button type="submit" class="btn-submit">Submit Message</button>
            </form>
        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 Welcome Portal. All operations secure.</p>
    </footer>

</body>

</html>
